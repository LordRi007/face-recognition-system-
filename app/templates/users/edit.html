{% extends "base.html" %}

{% block title %}Edit User - {{ user.name }}{% endblock %}
{% block page_header %}Modify User Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom">
      <div class="card-header-custom">
        <div class="d-flex align-items-center gap-2">
          <i data-lucide="edit" class="text-primary"></i>
          <h6 class="mb-0 fw-bold">Edit Profile: {{ user.name }}</h6>
        </div>
        <a href="{{ url_for('users.view_user', user_id=user.id) }}" class="btn btn-sm btn-outline-secondary">
          &larr; Back to Profile
        </a>
      </div>
      <div class="card-body-custom">
        <form method="POST" action="{{ url_for('users.edit_user', user_id=user.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="name" class="form-label small fw-semibold">Full Name *</label>
              <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label small fw-semibold">Email Address *</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="phone" class="form-label small fw-semibold">Phone Number</label>
              <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}">
            </div>
            <div class="col-md-6">
              <label for="department_id" class="form-label small fw-semibold">Department</label>
              <select class="form-select" id="department_id" name="department_id">
                <option value="">None</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}" {% if user.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="role" class="form-label small fw-semibold">Role</label>
              <select class="form-select" id="role" name="role" required>
                <option value="user" {% if user.role == 'user' %}selected{% endif %}>Regular User</option>
                <option value="staff" {% if user.role == 'staff' %}selected{% endif %}>Staff</option>
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="status" class="form-label small fw-semibold">Account Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="active" {% if user.status == 'active' %}selected{% endif %}>Active</option>
                <option value="inactive" {% if user.status == 'inactive' %}selected{% endif %}>Inactive</option>
                <option value="suspended" {% if user.status == 'suspended' %}selected{% endif %}>Suspended</option>
              </select>
            </div>
          </div>

          <hr class="my-4">

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="new_password" class="form-label small fw-semibold">Reset Password (Optional)</label>
              <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Leave blank to keep current">
            </div>
            <div class="col-md-6">
              <label for="new_pin" class="form-label small fw-semibold">Alternative PIN (Optional)</label>
              <input type="password" maxlength="6" class="form-control" id="new_pin" name="new_pin" placeholder="Leave blank to keep current">
              <div class="form-text small">4-6 digit numeric fallback for check-in.</div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('users.view_user', user_id=user.id) }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom d-flex align-items-center gap-2">
              <i data-lucide="save" style="width: 16px;"></i>
              <span>Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
