{% extends "base.html" %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="stat-icon stat-icon-amber mx-auto mb-3" style="width: 72px; height: 72px;">
    <i data-lucide="shield-alert" style="width: 36px; height: 36px;"></i>
  </div>
  <h2 class="fw-bold mb-2">403 - Access Forbidden</h2>
  <p class="text-muted col-md-6 mx-auto mb-4">
    You do not possess the required administrative permissions or role to access this resource.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">Return to Dashboard</a>
</div>
{% endblock %}
