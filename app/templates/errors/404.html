{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="stat-icon stat-icon-blue mx-auto mb-3" style="width: 72px; height: 72px;">
    <i data-lucide="compass" style="width: 36px; height: 36px;"></i>
  </div>
  <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
  <p class="text-muted col-md-6 mx-auto mb-4">
    The page or API endpoint you requested does not exist or has been relocated.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">Return to Dashboard</a>
</div>
{% endblock %}
